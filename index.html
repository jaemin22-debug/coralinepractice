<div class="controls">
    <button id="recordBtn" style="grid-column: span 2;">🎤 녹음 시작/중지</button>
    <button id="playBtn" style="background-color: #2ed573; color: white;">▶ 들어보기</button>
    <button id="downloadBtn" style="background-color: #3742fa; color: white;">💾 내 폰에 저장</button>
</div>

<script>
    let mediaRecorder;
    let audioChunks = [];
    let audioUrl = '';

    const recordBtn = document.getElementById('recordBtn');
    const playBtn = document.getElementById('playBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const audioPlayback = document.getElementById('audioPlayback');

    recordBtn.onclick = async () => {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
            recordBtn.innerText = "🎤 다시 녹음하기";
            recordBtn.style.backgroundColor = "#ff4757";
        } else {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
            mediaRecorder = new MediaRecorder(stream, { mimeType });
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstart = () => {
                recordBtn.innerText = "⏹ 녹음 중지 (Stop)";
                recordBtn.style.backgroundColor = "#57606f";
            };
            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                audioUrl = URL.createObjectURL(audioBlob);
                audioPlayback.src = audioUrl;
                alert("녹음이 완료되었습니다! '들어보기'나 '저장하기'를 누르세요.");
            };
            mediaRecorder.start();
        }
    };

    playBtn.onclick = () => {
        if (!audioUrl) return alert("먼저 녹음을 해주세요!");
        audioPlayback.play();
    };

    downloadBtn.onclick = () => {
        if (!audioUrl) return alert("저장할 녹음 본이 없습니다!");
        const a = document.createElement('a');
        a.href = audioUrl;
        a.download = `coraline_reading.mp3`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    };
</script>
